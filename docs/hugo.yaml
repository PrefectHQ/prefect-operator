baseURL: https://prefecthq.github.io/prefect-operator/
title: Prefect Operator
locale: en-us
enableGitInfo: false

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false

params:
  navbar:
    displayTitle: true
    # The Prefect logomark, cropped from docs/logos in PrefectHQ/prefect.
    logo:
      path: images/logo-mark-black.svg
      dark: images/logo-mark-white.svg
      width: 18
      height: 24
  page:
    width: wide
  search:
    enable: true
    type: flexsearch
  editURL:
    enable: true
    base: https://github.com/PrefectHQ/prefect-operator/edit/main/docs/content
  footer:
    displayCopyright: false
    displayPoweredBy: false

menu:
  main:
    - name: Docs
      pageRef: /
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/PrefectHQ/prefect-operator
      params:
        icon: github
