suite: custom resource definitions

templates:
  - templates/crds.yaml

tests:
  - it: renders a CRD for each custom resource
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: CustomResourceDefinition
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: prefectservers.prefect.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: prefectworkpools.prefect.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: prefectworkqueues.prefect.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: prefectdeployments.prefect.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: prefectautomations.prefect.io
          any: true

  - it: keeps the CRDs when the release is uninstalled
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: keeps the annotations and schema that controller-gen wrote
    documentSelector:
      path: metadata.name
      value: prefectworkpools.prefect.io
    asserts:
      - exists:
          path: metadata.annotations["controller-gen.kubebuilder.io/version"]
      - equal:
          path: spec.group
          value: prefect.io
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.tolerations
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.workers.format
          value: int32

  - it: adds the chart's standard and common labels and annotations
    release:
      name: my-release
    set:
      commonLabels:
        team: platform
      commonAnnotations:
        owner: platform
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: my-release
      - equal:
          path: metadata.labels.team
          value: platform
      - equal:
          path: metadata.annotations.owner
          value: platform

  - it: doesn't let common annotations replace the keep policy
    set:
      commonAnnotations:
        helm.sh/resource-policy: delete
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: renders nothing when CRD installation is off
    set:
      crds.install: false
    asserts:
      - hasDocuments:
          count: 0
