apiVersion: prefect.io/v1
kind: PrefectWorkPool
metadata:
  labels:
    app.kubernetes.io/name: prefect-operator
    app.kubernetes.io/managed-by: kustomize
  name: sample-k8s-pool
spec:
  deploymentLabels:
    deployment: label
  type: kubernetes
  server:
    name: prefect-ephemeral
  workers: 3
  # serviceAccountName: prefect-worker  # Optional: custom ServiceAccount for worker pods
  # A strategic merge patch over the worker pods. Containers are matched by name.
  deploymentTemplate:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
