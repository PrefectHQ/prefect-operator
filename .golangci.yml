version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - goconst
        path: _test\.go
      # The fake Prefect API repeats Prefect's JSON field names.
      - linters:
          - goconst
        path: internal/prefect/prefecttest/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
