---
name: Unit tests

"on":
  workflow_call: {}
  # There is no branches filter, so that pull requests in a stack, which target
  # other branches than main, run the tests too.
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .mise.toml
      - Makefile
      # The tests load the CRDs and admission policies from the chart.
      - deploy/charts/**
      - .github/workflows/tests.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      # required to read from the repo
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tool dependencies
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          experimental: true  # enables the go installation backend

      - name: Build
        run: make build

      - name: Test
        run: make test
