---
# https://github.com/helm-unittest/helm-unittest
name: Run Helm Unit Tests

"on":
  pull_request:
    branches:
      - main
    paths:
      - deploy/charts/**
      - .github/workflows/helm-unittest.yaml

permissions: {}

jobs:
  unittest:
    name: Run Helm Unit Tests
    runs-on: ubuntu-latest
    permissions:
      # required to read from the repo
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build deploy/charts/prefect-operator

      # The image has Helm and the helm-unittest plugin installed, so the job
      # doesn't install the plugin. helm-unittest creates tests/__snapshot__ in
      # the checkout, so the container runs as the runner's user, which owns
      # the checkout. That user has no home directory in the image, and Helm
      # needs a writable one for its cache.
      - name: Run chart unit tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${GITHUB_WORKSPACE}/deploy/charts/prefect-operator:/apps" \
            helmunittest/helm-unittest:4.3.0-1.2.1@sha256:28ea86c3e0b07f501f0c2e9c08b9f41e240f4a4b571cb5106b36cf0f0607e989 \
            .
